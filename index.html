<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World Weather</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            text-align: center;

            color: white;

            overflow-x: hidden;

            background:
                linear-gradient(
                    135deg,
                    #74c0fc,
                    #4dabf7,
                    #228be6
                );

            transition:
                background 1.5s ease;
        }


        /* =================================
           WEATHER ATMOSPHERE
        ================================= */

        .sky {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /* SUN */

        .sun {

            position: absolute;

            width: 130px;

            height: 130px;

            top: 8%;

            right: 10%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff3bf 0%,
                    #ffd43b 45%,
                    #ffb703 100%
                );

            box-shadow:
                0 0 50px
                rgba(255, 212, 59, 0.9),

                0 0 100px
                rgba(255, 193, 7, 0.5);

            opacity: 0;

            transform: scale(0.7);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        .sun.visible {

            opacity: 1;

            transform: scale(1);

            animation:
                sunPulse 4s ease-in-out infinite;
        }


        @keyframes sunPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }


        /* CLOUDS */

        .cloud {

            position: absolute;

            left: -250px;

            font-size: 90px;

            opacity: 0;

            transition:
                opacity 1s ease;

            animation:
                cloudMove 35s linear infinite;
        }


        .cloud1 {

            top: 10%;
        }


        .cloud2 {

            top: 28%;

            font-size: 120px;

            animation-duration: 45s;
        }


        .cloud3 {

            top: 50%;

            font-size: 70px;

            animation-duration: 32s;
        }


        .cloud4 {

            top: 70%;

            font-size: 100px;

            animation-duration: 50s;
        }


        .cloud.visible {

            opacity: 0.8;
        }


        @keyframes cloudMove {

            from {

                transform:
                    translateX(-200px);
            }

            to {

                transform:
                    translateX(
                        calc(100vw + 400px)
                    );
            }
        }


        /* =================================
           RAIN
        ================================= */

        .rain {

            position: absolute;

            inset: 0;

            opacity: 0;

            transition:
                opacity 1s ease;
        }


        .rain.visible {

            opacity: 1;
        }


        .drop {

            position: absolute;

            top: -80px;

            width: 2px;

            height: 35px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            transform:
                rotate(15deg);

            animation:
                rainFall 0.55s linear infinite;
        }


        .drop:nth-child(1) {
            left: 3%;
            animation-delay: 0.1s;
        }

        .drop:nth-child(2) {
            left: 8%;
            animation-delay: 0.3s;
        }

        .drop:nth-child(3) {
            left: 13%;
            animation-delay: 0.5s;
        }

        .drop:nth-child(4) {
            left: 18%;
            animation-delay: 0.2s;
        }

        .drop:nth-child(5) {
            left: 23%;
            animation-delay: 0.6s;
        }

        .drop:nth-child(6) {
            left: 28%;
            animation-delay: 0.4s;
        }

        .drop:nth-child(7) {
            left: 33%;
            animation-delay: 0.1s;
        }

        .drop:nth-child(8) {
            left: 38%;
            animation-delay: 0.7s;
        }

        .drop:nth-child(9) {
            left: 43%;
            animation-delay: 0.3s;
        }

        .drop:nth-child(10) {
            left: 48%;
            animation-delay: 0.5s;
        }

        .drop:nth-child(11) {
            left: 53%;
            animation-delay: 0.2s;
        }

        .drop:nth-child(12) {
            left: 58%;
            animation-delay: 0.8s;
        }

        .drop:nth-child(13) {
            left: 63%;
            animation-delay: 0.4s;
        }

        .drop:nth-child(14) {
            left: 68%;
            animation-delay: 0.1s;
        }

        .drop:nth-child(15) {
            left: 73%;
            animation-delay: 0.6s;
        }

        .drop:nth-child(16) {
            left: 78%;
            animation-delay: 0.3s;
        }

        .drop:nth-child(17) {
            left: 83%;
            animation-delay: 0.7s;
        }

        .drop:nth-child(18) {
            left: 88%;
            animation-delay: 0.2s;
        }

        .drop:nth-child(19) {
            left: 93%;
            animation-delay: 0.5s;
        }

        .drop:nth-child(20) {
            left: 98%;
            animation-delay: 0.1s;
        }


        @keyframes rainFall {

            from {

                transform:
                    translateY(-100px)
                    rotate(15deg);
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(15deg);
            }
        }


        /* =================================
           SNOW
        ================================= */

        .snow {

            position: absolute;

            inset: 0;

            opacity: 0;

            transition:
                opacity 1s ease;
        }


        .snow.visible {

            opacity: 1;
        }


        .flake {

            position: absolute;

            top: -30px;

            color: white;

            font-size: 22px;

            animation:
                snowFall
                5s linear infinite;
        }


        .flake:nth-child(1) {
            left: 5%;
            animation-delay: 0s;
        }

        .flake:nth-child(2) {
            left: 15%;
            animation-delay: 1s;
        }

        .flake:nth-child(3) {
            left: 25%;
            animation-delay: 2s;
        }

        .flake:nth-child(4) {
            left: 35%;
            animation-delay: 0.5s;
        }

        .flake:nth-child(5) {
            left: 45%;
            animation-delay: 1.5s;
        }

        .flake:nth-child(6) {
            left: 55%;
            animation-delay: 2.5s;
        }

        .flake:nth-child(7) {
            left: 65%;
            animation-delay: 0.8s;
        }

        .flake:nth-child(8) {
            left: 75%;
            animation-delay: 1.8s;
        }

        .flake:nth-child(9) {
            left: 85%;
            animation-delay: 2.8s;
        }

        .flake:nth-child(10) {
            left: 95%;
            animation-delay: 1.2s;
        }


        @keyframes snowFall {

            from {

                transform:
                    translateY(-30px)
                    rotate(0deg);
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(360deg);
            }
        }


        /* =================================
           LIGHTNING
        ================================= */

        .lightning {

            position: absolute;

            inset: 0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0
                );

            opacity: 0;

            pointer-events: none;
        }


        .lightning.visible {

            animation:
                lightningFlash 4s infinite;
        }


        @keyframes lightningFlash {

            0%,
            85%,
            100% {

                opacity: 0;
            }

            88% {

                opacity: 0.85;
            }

            89% {

                opacity: 0;
            }

            91% {

                opacity: 0.65;
            }

            92% {

                opacity: 0;
            }
        }


        /* =================================
           FOG
        ================================= */

        .fog {

            position: absolute;

            inset: 0;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            backdrop-filter:
                blur(2px);

            opacity: 0;

            transition:
                opacity 1s ease;
        }


        .fog.visible {

            opacity: 1;
        }


        /* =================================
           WEATHER MODES
        ================================= */

        body.clear {

            background:
                linear-gradient(
                    135deg,
                    #74c0fc,
                    #4dabf7,
                    #228be6
                );
        }


        body.cloudy {

            background:
                linear-gradient(
                    135deg,
                    #91a7b8,
                    #748ffc,
                    #5c7cfa
                );
        }


        body.rainy {

            background:
                linear-gradient(
                    135deg,
                    #526777,
                    #36454f,
                    #24343d
                );
        }


        body.stormy {

            background:
                linear-gradient(
                    135deg,
                    #343a40,
                    #212529,
                    #101418
                );
        }


        body.snowy {

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #93c5fd,
                    #64748b
                );
        }


        body.foggy {

            background:
                linear-gradient(
                    135deg,
                    #adb5bd,
                    #868e96,
                    #6c757d
                );
        }


        /* =================================
           WELCOME SCREEN
        ================================= */

        #welcomeScreen {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            position: relative;

            z-index: 1;
        }


        .welcomeContent {

            max-width: 500px;
        }


        .globe {

            font-size: 80px;

            animation:
                globeFloat 3s ease-in-out infinite;
        }


        .welcomeContent h1 {

            font-size: 48px;

            margin:
                15px 0 10px;

            animation:
                titleAppear 1s ease;
        }


        .welcomeContent p {

            font-size: 20px;

            margin-bottom: 30px;

            animation:
                titleAppear 1.3s ease;
        }


        #nameInput {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            font-size: 17px;

            outline: none;

            margin-bottom: 15px;

            animation:
                slideUp 1.5s ease;
        }


        #continueButton {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #1971c2;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            animation:
                slideUp 1.7s ease;

            transition: 0.3s;
        }


        #continueButton:hover {

            transform:
                scale(1.03);
        }


        /* =================================
           WEATHER APP
        ================================= */

        #weatherApp {

            display: none;

            min-height: 100vh;

            padding:
                30px 20px;

            position: relative;

            z-index: 1;

            animation:
                appAppear 0.8s ease;
        }


        #greeting {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .subtitle {

            margin-bottom: 25px;

            font-size: 18px;
        }


        /* SEARCH */

        .searchArea {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 15px;
        }


        #cityInput {

            width: 280px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            outline: none;
        }


        #searchButton,
        #locationButton {

            padding:
                14px 18px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #1971c2;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        #searchButton:hover,
        #locationButton:hover {

            transform:
                translateY(-2px);
        }


        #locationButton {

            margin-bottom: 25px;
        }


        /* STATUS */

        #status {

            min-height: 25px;

            margin:
                10px 0 20px;

            font-weight: bold;
        }


        /* =================================
           WEATHER CARD
        ================================= */

        .weatherCard {

            max-width: 600px;

            margin:
                0 auto 35px;

            padding: 30px;

            border-radius: 25px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 15px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );

            transition: 0.3s;
        }


        .weatherCard:hover {

            transform:
                translateY(-5px);
        }


        #locationText {

            font-size: 20px;

            margin-bottom: 10px;
        }


        #temperature {

            font-size: 64px;

            font-weight: bold;

            margin:
                10px 0;
        }


        #condition {

            font-size: 24px;

            margin-bottom: 25px;
        }


        .weatherInfo {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .infoBox {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.2
                );

            padding:
                15px 25px;

            border-radius: 15px;

            min-width: 140px;
        }


        .infoBox strong {

            display: block;

            font-size: 20px;

            margin-bottom: 5px;
        }


        /* =================================
           FORECAST
        ================================= */

        .forecastTitle {

            margin-bottom: 5px;
        }


        .forecastSubtitle {

            margin-bottom: 20px;

            opacity: 0.9;
        }


        #forecast {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .forecastCard {

            width: 150px;

            padding:
                20px 15px;

            border-radius: 20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            backdrop-filter:
                blur(8px);

            transition: 0.3s;
        }


        .forecastCard:hover {

            transform:
                translateY(-7px);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );
        }


        .forecastDay {

            font-size: 18px;

            font-weight: bold;
        }


        .forecastIcon {

            font-size: 40px;

            margin:
                12px 0;
        }


        .forecastCondition {

            font-size: 14px;

            margin-bottom: 10px;
        }


        .forecastHigh {

            font-size: 22px;

            font-weight: bold;
        }


        .forecastLow {

            margin-top: 5px;

            opacity: 0.8;
        }


        /* =================================
           GENERAL ANIMATIONS
        ================================= */

        @keyframes globeFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-12px);
            }
        }


        @keyframes titleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes slideUp {

            from {

                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes appAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .hide {

            animation:
                welcomeExit 0.7s ease forwards;
        }


        @keyframes welcomeExit {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .welcomeContent h1 {

                font-size: 38px;
            }


            #greeting {

                font-size: 25px;
            }


            #temperature {

                font-size: 52px;
            }


            .weatherCard {

                padding: 22px;
            }


            .forecastCard {

                width: 135px;
            }


            .sun {

                width: 80px;

                height: 80px;
            }

        }

    </style>

</head>

    <script>


        /* =================================
           ELEMENTS
        ================================= */

        const welcomeScreen =
            document.getElementById(
                "welcomeScreen"
            );


        const weatherApp =
            document.getElementById(
                "weatherApp"
            );


        const nameInput =
            document.getElementById(
                "nameInput"
            );


        const continueButton =
            document.getElementById(
                "continueButton"
            );


        const greeting =
            document.getElementById(
                "greeting"
            );


        const cityInput =
            document.getElementById(
                "cityInput"
            );


        const searchButton =
            document.getElementById(
                "searchButton"
            );


        const locationButton =
            document.getElementById(
                "locationButton"
            );


        const status =
            document.getElementById(
                "status"
            );


        const locationText =
            document.getElementById(
                "locationText"
            );


        const temperature =
            document.getElementById(
                "temperature"
            );


        const condition =
            document.getElementById(
                "condition"
            );


        const humidity =
            document.getElementById(
                "humidity"
            );


        const wind =
            document.getElementById(
                "wind"
            );


        const forecast =
            document.getElementById(
                "forecast"
            );


        /* WEATHER EFFECT ELEMENTS */

        const sun =
            document.getElementById(
                "sun"
            );


        const rain =
            document.getElementById(
                "rain"
            );


        const snow =
            document.getElementById(
                "snow"
            );


        const lightning =
            document.getElementById(
                "lightning"
            );


        const fog =
            document.getElementById(
                "fog"
            );


        const clouds =
            document.querySelectorAll(
                ".cloud"
            );



        /* =================================
           WELCOME SCREEN
        ================================= */

        const savedName =
            localStorage.getItem(
                "weatherUserName"
            );


        if (savedName) {

            greeting.textContent =
                "Welcome back, "
                + savedName
                + "! 👋";
        }


        continueButton.addEventListener(
            "click",
            function () {


                const name =
                    nameInput.value.trim();


                if (name === "") {

                    alert(
                        "Please enter your name first!"
                    );

                    return;
                }


                localStorage.setItem(
                    "weatherUserName",
                    name
                );


                greeting.textContent =
                    "Welcome, "
                    + name
                    + "! 👋";


                welcomeScreen.classList.add(
                    "hide"
                );


                setTimeout(
                    function () {

                        welcomeScreen.style.display =
                            "none";

                        weatherApp.style.display =
                            "block";

                    },
                    700
                );

            }
        );



        /* =================================
           WEATHER ICON
        ================================= */

        function getWeatherIcon(code) {


            if (code === 0)
                return "☀️";


            if (code === 1)
                return "🌤️";


            if (code === 2)
                return "⛅";


            if (code === 3)
                return "☁️";


            if (
                code >= 51 &&
                code <= 57
            )
                return "🌧️";


            if (
                code >= 61 &&
                code <= 67
            )
                return "🌧️";


            if (
                code >= 71 &&
                code <= 77
            )
                return "❄️";


            if (
                code >= 80 &&
                code <= 82
            )
                return "🌦️";


            if (code >= 95)
                return "⛈️";


            return "🌍";
        }



        /* =================================
           WEATHER DESCRIPTION
        ================================= */

        function getWeatherDescription(code) {


            if (code === 0)
                return "Clear sky";


            if (code === 1)
                return "Mainly clear";


            if (code === 2)
                return "Partly cloudy";


            if (code === 3)
                return "Overcast";


            if (
                code >= 51 &&
                code <= 57
            )
                return "Drizzle";


            if (
                code >= 61 &&
                code <= 67
            )
                return "Rain";


            if (
                code >= 71 &&
                code <= 77
            )
                return "Snow";


            if (
                code >= 80 &&
                code <= 82
            )
                return "Rain showers";


            if (code >= 95)
                return "Thunderstorm";


            return "Unknown weather";
        }



        /* =================================
           REAL WEATHER ATMOSPHERE
        ================================= */

        function updateWeatherScene(code) {


            /* RESET EVERYTHING */

            document.body.className = "";


            sun.classList.remove(
                "visible"
            );


            rain.classList.remove(
                "visible"
            );


            snow.classList.remove(
                "visible"
            );


            lightning.classList.remove(
                "visible"
            );


            fog.classList.remove(
                "visible"
            );


            clouds.forEach(
                function (cloud) {

                    cloud.classList.remove(
                        "visible"
                    );

                }
            );


            /* =============================
               CLEAR
            ============================= */

            if (code === 0) {

                document.body.classList.add(
                    "clear"
                );

                sun.classList.add(
                    "visible"
                );

            }


            /* =============================
               MAINLY CLEAR
            ============================= */

            else if (code === 1) {

                document.body.classList.add(
                    "clear"
                );

                sun.classList.add(
                    "visible"
                );

                clouds[0].classList.add(
                    "visible"
                );

            }


            /* =============================
               PARTLY CLOUDY
            ============================= */

            else if (code === 2) {

                document.body.classList.add(
                    "cloudy"
                );

                sun.classList.add(
                    "visible"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

            }


            /* =============================
               OVERCAST
            ============================= */

            else if (code === 3) {

                document.body.classList.add(
                    "cloudy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

            }


            /* =============================
               DRIZZLE
            ============================= */

            else if (
                code >= 51 &&
                code <= 57
            ) {

                document.body.classList.add(
                    "rainy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

                rain.classList.add(
                    "visible"
                );

            }


            /* =============================
               RAIN
            ============================= */

            else if (
                code >= 61 &&
                code <= 67
            ) {

                document.body.classList.add(
                    "rainy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

                rain.classList.add(
                    "visible"
                );

            }


            /* =============================
               SNOW
            ============================= */

            else if (
                code >= 71 &&
                code <= 77
            ) {

                document.body.classList.add(
                    "snowy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

                snow.classList.add(
                    "visible"
                );

            }


            /* =============================
               RAIN SHOWERS
            ============================= */

            else if (
                code >= 80 &&
                code <= 82
            ) {

                document.body.classList.add(
                    "rainy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

                rain.classList.add(
                    "visible"
                );

            }


            /* =============================
               THUNDERSTORM
            ============================= */

            else if (code >= 95) {

                document.body.classList.add(
                    "stormy"
                );

                clouds.forEach(
                    function (cloud) {

                        cloud.classList.add(
                            "visible"
                        );

                    }
                );

                rain.classList.add(
                    "visible"
                );

                lightning.classList.add(
                    "visible"
                );

            }

        }



        /* =================================
           DAY NAME
        ================================= */

        function getDayName(dateString) {


            const date =
                new Date(dateString);


            return date.toLocaleDateString(
                "en-US",
                {
                    weekday: "short"
                }
            );
        }



        /* =================================
           SEARCH CITY
        ================================= */

        async function searchCity(city) {


            if (city === "") {

                alert(
                    "Please enter a city!"
                );

                return;
            }


            status.textContent =
                "🔎 Searching...";


            try {


                const geoURL =
                    "https://geocoding-api.open-meteo.com/v1/search?name="
                    + encodeURIComponent(city)
                    + "&count=1"
                    + "&language=en"
                    + "&format=json";


                const geoResponse =
                    await fetch(
                        geoURL
                    );


                const geoData =
                    await geoResponse.json();


                if (
                    !geoData.results ||
                    geoData.results.length === 0
                ) {

                    status.textContent =
                        "❌ City not found.";

                    return;
                }


                const place =
                    geoData.results[0];


                getWeather(

                    place.latitude,

                    place.longitude,

                    place.name,

                    place.country

                );


            }
            catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Something went wrong. Please try again.";

            }

        }



        /* =================================
           SEARCH BUTTON
        ================================= */

        searchButton.addEventListener(
            "click",
            function () {

                searchCity(
                    cityInput.value.trim()
                );

            }
        );



        /* =================================
           ENTER KEY
        ================================= */

        cityInput.addEventListener(
            "keydown",
            function (event) {


                if (
                    event.key === "Enter"
                ) {

                    searchCity(
                        cityInput.value.trim()
                    );

                }

            }
        );



        /* =================================
           GET WEATHER
        ================================= */

        async function getWeather(

            latitude,
            longitude,
            placeName,
            countryName

        ) {


            status.textContent =
                "🌤️ Loading weather...";


            try {


                const weatherURL =

                    "https://api.open-meteo.com/v1/forecast?"
                    + "latitude=" + latitude
                    + "&longitude=" + longitude
                    + "&current="
                    + "temperature_2m,"
                    + "relative_humidity_2m,"
                    + "wind_speed_10m,"
                    + "weather_code"
                    + "&daily="
                    + "weather_code,"
                    + "temperature_2m_max,"
                    + "temperature_2m_min"
                    + "&forecast_days=5"
                    + "&timezone=auto";


                const response =
                    await fetch(
                        weatherURL
                    );


                const data =
                    await response.json();


                /* CURRENT WEATHER */

                const currentWeather =
                    data.current;


                const currentTemperature =
                    Math.round(
                        currentWeather
                            .temperature_2m
                    );


                const currentHumidity =
                    currentWeather
                        .relative_humidity_2m;


                const currentWind =
                    Math.round(
                        currentWeather
                            .wind_speed_10m
                    );


                const weatherCode =
                    currentWeather
                        .weather_code;


                /* UPDATE ATMOSPHERE */

                updateWeatherScene(
                    weatherCode
                );


                /* UPDATE WEATHER CARD */

                locationText.textContent =
                    "📍 "
                    + placeName
                    + (
                        countryName
                            ? ", " + countryName
                            : ""
                    );


                temperature.textContent =
                    currentTemperature
                    + "°C";


                condition.textContent =
                    getWeatherIcon(
                        weatherCode
                    )
                    + " "
                    + getWeatherDescription(
                        weatherCode
                    );


                humidity.textContent =
                    currentHumidity
                    + "%";


                wind.textContent =
                    currentWind
                    + " km/h";


                /* =================================
                   5 DAY FORECAST
                ================================= */

                forecast.innerHTML = "";


                for (
                    let i = 0;
                    i < 5;
                    i++
                ) {


                    const day =
                        data.daily.time[i];


                    const dailyWeatherCode =
                        data.daily
                            .weather_code[i];


                    const maxTemperature =
                        Math.round(
                            data.daily
                                .temperature_2m_max[i]
                        );


                    const minTemperature =
                        Math.round(
                            data.daily
                                .temperature_2m_min[i]
                        );


                    const forecastCard =
                        document.createElement(
                            "div"
                        );


                    forecastCard.className =
                        "forecastCard";


                    forecastCard.innerHTML = `

                        <div class="forecastDay">
                            ${getDayName(day)}
                        </div>

                        <div class="forecastIcon">
                            ${getWeatherIcon(
                                dailyWeatherCode
                            )}
                        </div>

                        <div class="forecastCondition">
                            ${getWeatherDescription(
                                dailyWeatherCode
                            )}
                        </div>

                        <div class="forecastHigh">
                            ${maxTemperature}°C
                        </div>

                        <div class="forecastLow">
                            Low ${minTemperature}°C
                        </div>

                    `;


                    forecast.appendChild(
                        forecastCard
                    );

                }


                status.textContent =
                    "✅ Weather updated!";


            }
            catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Could not load weather.";

            }

        }



        /* =================================
           USE MY LOCATION
        ================================= */

        locationButton.addEventListener(
            "click",
            function () {


                if (
                    !navigator.geolocation
                ) {

                    status.textContent =
                        "❌ Your browser does not support location.";

                    return;
                }


                status.textContent =
                    "📍 Getting your live location...";


                navigator.geolocation.getCurrentPosition(

                    async function (position) {


                        const latitude =
                            position.coords
                                .latitude;


                        const longitude =
                            position.coords
                                .longitude;


                        try {


                            const reverseURL =

                                "https://geocoding-api.open-meteo.com/v1/reverse?"
                                + "latitude="
                                + latitude
                                + "&longitude="
                                + longitude
                                + "&language=en"
                                + "&format=json";


                            const reverseResponse =
                                await fetch(
                                    reverseURL
                                );


                            const reverseData =
                                await reverseResponse.json();


                            let placeName =
                                "Your Location";


                            let countryName =
                                "";


                            if (

                                reverseData.results &&

                                reverseData.results.length > 0

                            ) {


                                const place =
                                    reverseData
                                        .results[0];


                                placeName =

                                    place.name ||

                                    place.city ||

                                    place.town ||

                                    place.village ||

                                    place.municipality ||

                                    "Your Location";


                                countryName =
                                    place.country ||
                                    "";

                            }


                            getWeather(

                                latitude,

                                longitude,

                                placeName,

                                countryName

                            );


                        }
                        catch (error) {


                            console.error(
                                error
                            );


                            getWeather(

                                latitude,

                                longitude,

                                "Your Location",

                                ""

                            );

                        }

                    },


                    function (error) {


                        if (
                            error.code === 1
                        ) {

                            status.textContent =
                                "❌ Location permission was denied.";

                        }

                        else if (
                            error.code === 2
                        ) {

                            status.textContent =
                                "❌ Your location could not be detected.";

                        }

                        else if (
                            error.code === 3
                        ) {

                            status.textContent =
                                "❌ Location request timed out.";

                        }

                        else {

                            status.textContent =
                                "❌ Could not get your location.";

                        }

                    },


                    {

                        enableHighAccuracy: true,

                        timeout: 10000,

                        maximumAge: 0

                    }

                );

            }
        );

    </script>
